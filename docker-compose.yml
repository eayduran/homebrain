services:
  recordings-init:
    image: alpine:3.23
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /data/recordings"]
    restart: "no"
    volumes:
      - "./recordings:/data/recordings"

  home-brain-rtc:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      recordings-init:
        condition: service_completed_successfully
    env_file:
      - .env
    ports:
      - "8080:8080/tcp"
      - "40000-40020:40000-40020/udp"
    volumes:
      - "./recordings:/data/recordings"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 15s
